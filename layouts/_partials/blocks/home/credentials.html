<section class="border-y border-gray-100 py-6">
  <div class="container mx-auto px-4">
    <div class="flex flex-wrap items-center justify-center gap-2 text-sm text-gray-500">
      {{ range .items }}
        <span class="flex items-center gap-2">
          <span class="text-primary font-semibold">✓</span>
          {{ . }}
        </span>
        <span class="last:hidden text-gray-300">|</span>
      {{ end }}
    </div>
  </div>
</section>
