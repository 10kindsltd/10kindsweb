<section class="bg-primary/10 py-16">
  <div class="container mx-auto px-4">
    <div class="flex flex-col items-start gap-6 xl:flex-row xl:items-center xl:justify-between">
      <div class="max-w-2xl">
        {{ with .title }}
          <h2 class="mb-3 text-2xl font-bold  xl:text-3xl">{{ . }}</h2>
        {{ end }}
        {{ with .text }}
          {{ range (split . "\n") }}
            {{ if . }}
              <p class="md-links mb-3">{{ . | markdownify }}</p>
            {{ end }}
          {{ end }}
        {{ end }}
      </div>
      {{ with .button }}
        <div class="shrink-0">
          <a href="{{ .link }}" class="bg-primary hover:bg-primary/90 rounded px-8 py-3 text-white duration-500 whitespace-nowrap">
            {{ .label }}
          </a>
        </div>
      {{ end }}
    </div>
  </div>
</section>
