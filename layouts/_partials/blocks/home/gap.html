<section id="gap" class="py-16 bg-tertiary/25">
  <div class="container mx-auto px-4">
    {{ with .title }}
      <h2 class="xl:max-w-4xl mx-auto mb-4 text-center text-4xl xl:text-5xl font-bold">{{ . }}</h2>
    {{ end }}
    {{ with .text }}
      <p class="text-lg mx-auto mb-12 text-center xl:max-w-4xl">{{ . }}</p>
    {{ end }}
    {{ if .cards }}
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        {{ range .cards }}
          <div class="rounded-2xl bg-white px-6 py-8">
            {{ with .heading }}
              <h3 class="text-primary mb-3 font-semibold text-lg">{{ . }}</h3>
            {{ end }}
            {{ with .text }}
              <p class="text-gray-600">{{ . }}</p>
            {{ end }}
          </div>
        {{ end }}
      </div>
    {{ end }}
  </div>
</section>
