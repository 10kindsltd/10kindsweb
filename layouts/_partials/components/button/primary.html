{{ $href := partial "utilities/resolve-link" .href }}
{{ if .inverted }}
<a class="bg-white hover:bg-white/90 text-primary rounded-lg px-8 py-3 font-medium duration-500" href="{{ $href }}">
  {{ .label }}
</a>
{{ else }}
<a class="bg-primary hover:bg-primary/90 rounded-lg px-8 py-3 text-white font-medium duration-500" href="{{ $href }}">
  {{ .label }}
</a>
{{ end }}
