{{ $description := .Site.Params.description }}
{{ with .Description }}{{ $description = . }}{{ end }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": {{ .Site.Title | jsonify }},

  "url": {{ .Site.BaseURL | jsonify }}
}
</script>
