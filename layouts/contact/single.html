{{ define "main" }}
  <section class="bg-tertiary/25 py-16 xl:py-24">
    <div class="container mx-auto px-4">
      <div class="mx-auto max-w-2xl text-center">
        <h1 class="mb-4 text-4xl font-bold xl:text-6xl">{{ .Title }}</h1>
        {{ with .Params.intro }}
          <p class="mt-4 text-lg text-gray-600">{{ . }}</p>
        {{ end }}
      </div>
    </div>
  </section>

  <section class="py-16">
    <div class="container mx-auto px-4">
      <div class="mx-auto max-w-2xl">
        <form id="contact_form" action="https://formtorch.com/f/emxnqnm8v9" method="POST" class="flex flex-col gap-6">
          <input type="hidden" name="_redirect" value="/thank-you">

          <div class="flex flex-col gap-2">
            <label for="sender_name" class="font-semibold">Name</label>
            <input
              type="text"
              id="sender_name"
              name="sender_name"
              placeholder="Your name"
              class="rounded border border-gray-300 px-4 py-3 focus:border-gray-500 focus:outline-none"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="sender_email" class="font-semibold">Email address</label>
            <input
              type="email"
              id="sender_email"
              name="sender_email"
              placeholder="you@example.com"
              class="rounded border border-gray-300 px-4 py-3 focus:border-gray-500 focus:outline-none"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="body" class="font-semibold">Message</label>
            <p class="text-sm text-gray-500">Please include your phone number if you'd like us to call you.</p>
            <textarea
              id="body"
              name="body"
              rows="7"
              placeholder="Tell us about your business and what you're hoping to achieve with AI..."
              class="rounded border border-gray-300 px-4 py-3 focus:border-gray-500 focus:outline-none"
            ></textarea>
          </div>

          <div class="flex flex-col items-end gap-3">
            <button type="submit" class="bg-primary hover:bg-primary/90 rounded px-8 py-2 text-white duration-500">
              Send message
            </button>
            <p class="text-xs text-gray-400">
              By sending this message you agree to our <a href="/legals/privacy-policy/" class="underline">Privacy Policy</a> and to us using your details to reply to you.
            </p>
          </div>
        </form>
      </div>
    </div>
  </section>
{{ end }}
