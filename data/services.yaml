enable: true

title: "How we work together"
text: "Four tracks that run independently. Take one engagement, work through a track, or mix them. Every engagement is a fixed price against a written scope, with the deliverables named up front."

assurances:
  heading: "Our commitments"
  items:
    - heading: "Fixed scope, fixed price"
      text: "Each engagement is quoted at a fixed price against a scope agreed in writing before we start. No day-rate creep, and no surprise on the invoice."
    - heading: "Named deliverables"
      text: "You get the documents listed on each engagement at the end of it, so you can put them straight in front of a customer, an auditor or your board."
    - heading: "Start anywhere, stop anywhere"
      text: "Nothing here is a bundle or a prerequisite. Come for training, a prototype or a retainer on its own if that's what you need, and stop whenever you're done."
    - heading: "Confidential from the first call"
      text: "Everything you tell us stays between us, on the free call as much as in a paid engagement, and we'll sign your NDA beforehand if you'd rather have it in writing."

# `key` is the stable identifier pages filter on. Renaming `title` is safe;
# renaming `key` will silently empty a page, so grep layouts/ first.
groups:
  - key: "orientate"
    title: "Orientate"
    text: "Before Discover. For leadership teams working out whether AI is a fit at all, and what it could realistically do here."
    cards:
      - badge: "Explore"
        title: "AI Possibilities Session"
        question: "Is AI even a fit for us?"
        explanation: "Half a day with your leadership team on what AI can and can't do for an organisation like yours, before you commit to anything."
        price: "From £1,500"
        duration: "Half a day"
        deliverables:
          - "A plain-English tour of what current AI does well, and where it still falls over"
          - "Worked examples relevant to your sector rather than generic demos"
          - "A first pass at where AI might pay in your business, and where it wouldn't"
          - "A written summary you can take to the board"
          - "No obligation to do anything afterwards"
        button:
          label: "Discuss a session"
          link: ":calendly"

  - key: "govern"
    title: "Govern"
    text: "Discover, then Foundations. For when someone has asked you to prove AI is controlled. Join at whichever point matches where you already are."
    cards:
      - badge: "Discover"
        title: "AI Discovery"
        question: "What AI are we running, and where would it pay?"
        explanation: "Where AI is already being used across your business, where it should be, and whether your organisation can adopt it."
        price: "From £5,000"
        duration: "Typically 1-2 weeks"
        deliverables:
          - "A map of AI use across the business, including what nobody officially approved"
          - "A ranked shortlist of where AI would pay"
          - "Risk register covering data, suppliers and regulatory exposure"
          - "A straight go/no-go on what to do next"
        featured: true
        button:
          label: "Discuss discovery"
          link: ":calendly"

      - badge: "Agree"
        title: "AI Policy & Sign-off"
        question: "What are we allowed to do?"
        explanation: "What your organisation permits, decided and signed by your leadership. This sets the rules. Proving you follow them is the next engagement."
        price: "From £3,500"
        duration: "Typically 1-2 weeks"
        deliverables:
          - "Acceptable use policy: what's approved, what's off-limits"
          - "Which decisions need a human, and at which point"
          - "A named owner for every area of AI risk"
          - "Facilitated leadership session ending in sign-off"
          - "Board-ready policy document"
        button:
          label: "Discuss policy"
          link: ":calendly"

      - badge: "Assess"
        title: "Gap Assessment"
        question: "How far off are we from proving it?"
        explanation: "Where your controls stand against ISO/IEC 42001, clause by clause, and what it would cost to close the distance. Rules on paper are one thing; this tests whether you could evidence them to an auditor."
        price: "From £4,500"
        duration: "Typically 2 weeks"
        note: ""
        deliverables:
          - "Your existing controls mapped against ISO/IEC 42001, clause by clause"
          - "A written gap list, ranked by what a customer or auditor asks about first"
          - "Your AI inventory tested against what the standard asks for, or a first one built if you haven't got one"
          - "The regulatory questions worth putting to a solicitor, and the ones already settled"
          - "A remediation plan with the work costed, so the next decision is yours"
        button:
          label: "Discuss an assessment"
          link: ":calendly"

      - badge: "Close"
        title: "Compliance Readiness"
        question: "How do we close the gaps?"
        explanation: "The remediation itself, scoped against the gaps we found rather than guessed at before we started."
        price: "Quoted from your gap assessment"
        duration: "A few weeks"
        deliverables:
          - "The inventory turned into a live register, with an owner and a review cycle"
          - "Controls and documentation mapped to ISO/IEC 42001"
          - "AI Act-aligned controls and documentation, built to support your classification once it's confirmed"
          - "Human oversight and incident handling you can point an auditor at"
          - "Audit trail and evidence design"
          - "Certification-ready documentation"
        button:
          label: "Discuss readiness"
          link: ":calendly"

  - key: "train"
    title: "Train"
    text: "Foundations, and where most of the value is unlocked. Getting your people competent with these tools: what they do well, where they break, and how to check. Stands on its own, and ISO 42001 asks for evidence of it either way."
    cards:
      - badge: "Teams"
        title: "Team Training Day"
        question: "How do we get one team good at this?"
        explanation: "A working day with one team on where these tools help, where they go wrong, and how to tell."
        price: "£2,500"
        duration: "1 day"
        deliverables:
          - "Up to 10 people, with examples relevant to the work that team does"
          - "Where AI is reliable, where it is confidently wrong, and how to tell"
          - "Prompting and review habits that hold up under deadline pressure"
          - "How to keep AI use inside whatever rules your organisation has set"
          - "A written record of who attended and what was covered"
        button:
          label: "Discuss team training"
          link: ":calendly"

      - badge: "Organisation"
        title: "Corporate Training Day"
        question: "How do we get everyone good at this?"
        explanation: "The same day run across departments, pitched by role, with a plan for what happens after everyone goes back to their desk."
        price: "£3,500"
        duration: "1 day"
#        featured: true
        deliverables:
          - "Up to 20 people from more than one team"
          - "A short call beforehand so the day is pitched at the right level"
          - "Role-specific tracks rather than one session for everybody"
          - "An adoption plan naming who owns what after the day"
          - "Attendance and coverage records for your management system"
        button:
          label: "Discuss corporate training"
          link: ":calendly"

      - badge: "Leadership"
        title: "Leadership & Board Day"
        question: "What are we signing off?"
        explanation: "For the people signing off AI use and answering for it afterwards. What you are approving, what to ask, and where the exposure sits."
        price: "£5,000"
        duration: "1 day"
        deliverables:
          - "What current AI does well and where it still falls over, without the vendor gloss"
          - "Where AI would and would not pay across an organisation like yours, with examples relevant to your sector"
          - "The questions to put to a supplier, a team or a consultant before saying yes"
          - "A written summary you can take to the board"
        button:
          label: "Discuss a leadership day"
          link: ":calendly"

  - key: "build"
    title: "Build"
    text: "Takeoff. Automate a process, build a tool, ship a system. This track stands on its own, with no governance engagement needed first."
    cards:
      - badge: "Prototype"
        title: "Prototyping"
        question: "What is possible with our setup?"
        explanation: "Find out what's possible with your data and your workflows, before you scope anything bigger"
        price: "£3,500 / day"
        duration: "Typically a 1-2 days"
        deliverables:
          - "Booked by the day, usually one or two"
          - "A focused, one-off build session, not an ongoing engagement"
          - "Covers context, connections, automations and agents"
          - "Run as a team session or one-to-one, your call"
        button:
          label: "Discuss prototyping"
          link: ":calendly"

      - badge: "Build"
        title: "Custom Builds"
        question: "Can you build it and ship it?"
        explanation: "AI built into how your organisation works, not bolted on beside it."
        price: "Project-scoped"
        duration: "Weeks/months"
        deliverables:
          - "Systems that know your business context, data and terminology"
          - "Role-specific tools for the teams that need them"
          - "Automated workflows running on a schedule, not on someone remembering"
          - "A knowledge base that stays current as you do"
        button:
          label: "Discuss a build"
          link: ":calendly"

  - key: "support"
    title: "Support"
    text: "Takeoff, continued. Keeps any track alive afterwards, and available on its own."
    cards:
      - badge: "Sustain"
        title: "Advisory Retainer"
        question: "Who keeps this alive?"
        explanation: "Most consultants build it and leave. We stay on as the standing line to the person who built it."
        price: "£1,500 / month"
        duration: "Ongoing"
        deliverables:
          - "Monthly strategy session"
          - "Internal audit and management review on an annual cycle"
          - "Surveillance audit preparation"
          - "Updates on relevant AI advances and opportunities"
          - "Advice on AI tooling and vendor sense-checking"
          - "Quarterly AI capability benchmarking"
        button:
          label: "Discuss a retainer"
          link: ":calendly"
