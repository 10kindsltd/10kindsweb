enable: true

title: "How we work together"
text: "Most people start with governance to get things in order. Then we can help with opportunities we discover along the way. Every engagement is a fixed price against a written scope, the deliverables are named up front, and you can stop after any of them."

assurances:
  heading: "Our commitments"
  items:
    - heading: "Fixed scope, fixed price"
      text: "Each engagement is quoted at a fixed price against a scope agreed in writing before we start. No day-rate creep, and no surprise on the invoice."
    - heading: "Named deliverables"
      text: "You get the documents listed on each engagement at the end of it, so you can put them straight in front of a customer, an auditor or your board."
    - heading: "We build the machinery, not the legal opinion"
      text: "Your regulatory classification is a question for a solicitor. We build the inventory, risk process, documentation and oversight controls you need whichever way that answer goes."
    - heading: "We don't certify anyone"
      text: "Certification decisions rest with an accredited certification body, and no consultancy can both advise and certify. We build the management system and get you ready for that audit."

groups:
  - title: "Get In Control"
    text: "Know where AI is being used, agree the rules, and be ready to prove it."
    cards:
      - badge: "1: Discover"
        title: "AI Discovery"
        explanation: "Where AI is already being used across your business, where it should be, and whether your organisation can adopt it."
        price: "From £5,000"
        duration: "Typically 1-2 weeks"
        deliverables:
          - "A map of AI use across the business, including what nobody officially approved"
          - "A ranked shortlist of where AI would pay"
          - "Risk register covering data, suppliers and regulatory exposure"
          - "A straight go/no-go on what to do next"
        featured: true
        button:
          label: "Discuss discovery"
          link: ":calendly"

      - badge: "2: Agree"
        title: "AI Policy & Sign-off"
        explanation: "The rules your organisation runs by, agreed by the people who have to enforce them."
        price: "From £3,500"
        duration: "Typically 1-2 weeks"
        deliverables:
          - "Acceptable use policy: what's approved, what's off-limits"
          - "Which decisions need a human, and at which point"
          - "A named owner for every area of AI risk"
          - "Facilitated leadership session ending in sign-off"
          - "Board-ready policy document"
        button:
          label: "Discuss policy"
          link: ":calendly"

      - badge: "3: Assess"
        title: "Gap Assessment"
        explanation: "Two weeks and a fixed fee to find out how far you actually are from being able to prove it."
        price: "From £4,500"
        duration: "Typically 2 weeks"
        note: ""
        deliverables:
          - "Your existing controls mapped against ISO/IEC 42001, clause by clause"
          - "A written gap list, ranked by what a customer or auditor asks about first"
          - "An AI inventory covering the tools nobody put through procurement"
          - "The regulatory questions worth putting to a solicitor, and the ones already settled"
          - "A remediation plan with the work costed, so the next decision is yours"
        button:
          label: "Discuss an assessment"
          link: ":calendly"

      - badge: "4: Close"
        title: "Compliance Readiness"
        explanation: "The remediation itself, scoped against the gaps we found rather than guessed at before we started."
        price: "Quoted from your gap assessment"
        duration: "A few weeks"
        deliverables:
          - "AI inventory and risk process built and populated, not just specified"
          - "Controls and documentation mapped to ISO/IEC 42001"
          - "AI Act-aligned controls and documentation, built to support your classification once it's confirmed"
          - "Human oversight and incident handling you can point an auditor at"
          - "Audit trail and evidence design"
          - "Certification-ready documentation"
        button:
          label: "Discuss readiness"
          link: ":calendly"

      - badge: "5: Train"
        title: "Training"
        explanation: "Your team needs this regardless, and ISO 42001 requires evidence of it. Delivered by someone who builds AI products, not someone reciting a deck."
        price: "From £2,500"
        duration: "1/2 day - 1 day"
        deliverables:
          - "Team day, up to 10 people, hands-on with your real work"
          - "Corporate day, up to 20 people, with pre-scoping and an adoption plan"
          - "Leadership day: what you're signing off, what to ask, where the exposure sits"
        button:
          label: "Discuss training"
          link: ":calendly"

  - title: "Get Building"
    text: "Once the fix is clear, we build it and ship it."
    cards:
      - badge: "6: Prototype"
        title: "1-Day Prototyping"
        explanation: "One day to find out what's possible with your data and your workflows, before you scope anything bigger."
        price: "From £3,500 / day"
        duration: "One day"
        deliverables:
          - "A focused, one-off build session, not an ongoing engagement"
          - "Covers context, connections, automations and agents"
          - "Run as a team session or one-to-one, your call"
        button:
          label: "Discuss prototyping"
          link: ":calendly"

      - badge: "7: Build"
        title: "Custom Builds"
        explanation: "AI built into how your organisation works, not bolted on beside it."
        price: "Project-scoped"
        duration: "Weeks/months"
        deliverables:
          - "Systems that know your business context, data and terminology"
          - "Role-specific tools for the teams that need them"
          - "Automated workflows running on a schedule, not on someone remembering"
          - "A knowledge base that stays current as you do"
        button:
          label: "Discuss a build"
          link: ":calendly"

  - title: "Get On-Going Support"
    text: "A standing line to the person who built it, not a subscription that runs itself."
    cards:
      - badge: "8: Sustain"
        title: "Advisory Retainer"
        explanation: "Most consultants build it and leave. We stay on as the standing line to the person who built it."
        price: "£1,500 / month"
        duration: "Ongoing"
        deliverables:
          - "Monthly strategy session"
          - "Updates on relevant AI advances and opportunities"
          - "Advice on AI tooling and vendor sense-checking"
          - "Quarterly AI capability benchmarking"
        button:
          label: "Discuss a retainer"
          link: ":calendly"
