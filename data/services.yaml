enable: true

title: "Four ways to work together"
text: "From initial AI curiosity to active operational ownership, we guide your business step-by-step at your own pace."

cards:
  - badge: "1: Understand"
    title: "AI Education & Alignment"
    explanation: "Demystifying AI for your leadership and teams so everyone understands what is actually possible, what's hype, and where the real opportunities lie."
    price: "From £1,500"
    duration: "Half-day or full-day sessions"
    deliverables:
      - "Custom interactive workshop tailored to your specific industry and workflows"
      - "Frameworks for identifying and scoring AI use cases"
      - "A curated resource guide and session recording for ongoing team reference"
    button:
      label: "Book a session"
      link: ":calendly"

  - badge: "2: Advise"
    title: "Fractional AI Advisory"
    explanation: "Ongoing strategic guidance, vendor sense-checking, and leadership support to keep your AI initiatives on track without the cost of a full-time hire."
    price: "From £1,500 / month"
    duration: "Flexible retainer"
    featured: true
    deliverables:
      - "Dedicated strategic advisory hours and async support (Slack/Teams)"
      - "Objective reviews of third-party vendors, software proposals, and architecture decisions"
      - "Regular roadmap updates to align your AI adoption with evolving technology"
    button:
      label: "Discuss a retainer"
      link: ":calendly"

  - badge: "3: Explore"
    title: "Rapid AI Prototyping"
    explanation: "Test your highest-impact AI ideas quickly and cost-effectively to prove business value and user adoption before investing in full development."
    price: "From £1,500 / day"
#    duration: "2 to 3 weeks"
    deliverables:
      - "A working, interactive prototype built with secure, mock, or live data"
      - "Technical feasibility and data readiness assessment"
      - "Clear production cost estimate and implementation roadmap"
    button:
      label: "Discuss a prototype"
      link: ":calendly"

  - badge: "4: Build"
    title: "Custom AI Build"
    explanation: "Developing, securing, and integrating production-ready AI tools directly into your existing systems and business workflows."
    price: "Project-scoped"
#    duration: "Project-dependent"
    deliverables:
      - "Fully integrated, production-ready AI solution customized to your data"
      - "Built-in security guardrails to protect proprietary company and client data"
      - "Handover documentation, technical support, and team training sessions"
    button:
      label: "Discuss a project"
      link: ":calendly"
