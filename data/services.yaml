enable: true

title: "Five ways of working together"
text: "From a first read on where you stand to running the management system permanently, at your own pace."

cards:
  - badge: "1: Assess"
    title: "AI Governance Gap Assessment"
    explanation: "A structured assessment of your AI use against ISO/IEC 42001, covering the policies, ownership and evidence behind it as well as the technology."
    price: "From £6,000"
    duration: "~5 days"
    featured: true
    deliverables:
      - "Prioritised remediation plan mapped to the standard"
      - "Scored risk register with a named owner per area"
      - "A one-page summary you can take straight to the board"
    button:
      label: "Discuss an assessment"
      link: ":calendly"

  - badge: "2: Build"
    title: "AIMS Implementation"
    explanation: "We build the management system, run it, and get you ready for third-party audit, working with your engineering team so they actually use it, rather than handing over a template pack to quietly ignore."
    price: "From £25,000"
    duration: "~4 months, elapsed"
    deliverables:
      - "A working management system, built with your team rather than handed to them"
      - "Policies, register and evidence people actually maintain"
      - "Handover to an accredited certification body when you're ready"
    button:
      label: "Discuss implementation"
      link: ":calendly"

  - badge: "3: Deliver"
    title: "Custom AI Build"
    explanation: "Findings from an assessment often turn out to be engineering work, not policy work. We build it directly, whether that's a fix an assessment flagged or a standalone AI workflow you want built and shipped."
    price: "Project-scoped"
    duration: "Scoped per project"
    deliverables:
      - "Evaluation harnesses, logging, guardrails or access controls scoped from your findings"
      - "Or a standalone AI-enabled workflow, built and shipped end to end"
      - "Priced and scoped as its own project, separate from any assessment"
    button:
      label: "Discuss a build"
      link: ":calendly"

  - badge: "4: Train"
    title: "Training"
    explanation: "ISO 42001 requires evidence of competence and awareness, so your team needs this regardless. Delivered by someone who builds AI products, not someone reciting a deck."
    price: "From £2,500"
    duration: "Half-day to full-day"
    deliverables:
      - "AI literacy and compliance training for staff, up to 15 people"
      - "Building auditable AI: an engineering workshop for your technical team"
      - "A board and leadership session on what they're signing off and why"
    button:
      label: "Discuss training"
      link: ":calendly"

  - badge: "5: Sustain"
    title: "Governance Retainer"
    explanation: "ISO 42001 requires internal audit, management review and continual improvement, permanently. Most consultants build the system and leave. We stay on as the standing line to the person who built it."
    price: "From £2,000 / month"
    duration: "Ongoing, scoped in days"
    deliverables:
      - "Annual internal audit and management review support"
      - "Surveillance audit preparation"
      - "A fixed monthly allowance of days, not unlimited free support"
    button:
      label: "Discuss a retainer"
      link: ":calendly"
