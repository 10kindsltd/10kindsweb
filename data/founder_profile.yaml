bio: |
  Alan Bates is the founder of 10 Kinds, an AI consultancy that helps organisations get control of the AI they already use, then build valuable tools & workflows. He's spent **over 20 years working hands-on in technology**, including multiple years at household names in media, telecoms and finance.

  Alan is also the **founder of [Bazam.ai](https://bazam.ai)**, an automated content marketing platform sold B2B. He also holds a **Postgraduate Diploma in Business Administration**, giving him formal grounding on the commercial side as well as the technical.

  Building and shipping AI products himself is what shapes the judgement behind 10 Kinds' advice: the controls an engineering team will follow, rather than the ones that read well in a policy document. The team works with leadership and engineering groups to find where AI risk sits, gets organisations ready for the moment someone asks them to prove it, and builds the systems that change how the business runs.
