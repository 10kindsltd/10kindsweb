bio: |
  Alan Bates is the founder of 10 Kinds, an AI governance and assurance consultancy helping organisations get control of the AI they use or sell. He's spent **over 20 years working hands-on in technology**, including multiple years at household names in media, telecoms and finance.

  Alan is also the **founder of [Bazam.ai](https://bazam.ai)**, an automated content marketing platform sold B2B. He also holds a **Postgraduate Diploma in Business Administration**, giving him formal grounding on the commercial side as well as the technical.

  Building and shipping AI products himself is what shapes which controls he recommends: the ones that actually survive contact with an engineering team, rather than the ones that just read well in a policy document. He works with leadership and engineering teams to find where AI risk actually sits, build a management system people will keep using, and get organisations ready for the moment someone asks them to prove it.
