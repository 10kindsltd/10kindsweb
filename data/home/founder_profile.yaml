bio: |
  Alan Bates is the founder of 10 Kinds, an AI consultancy helping businesses move from AI curiosity to practical implementation. He's spent **over 20 years working hands-on in technology**, including multiple years at household names in media, telecoms and finance. 
  
  Alan also holds a **Postgraduate Diploma in Business Administration**, giving him formal grounding on the commercial side as well as the technical.
  
  His fluency in both business and tech means he can see what's technically possible and what's commercially worth doing, then translate between the two. He works with leadership teams to identify where AI can realistically add value, test those ideas through rapid prototyping, and move from one-off experiments to tools their teams actually use.

