enable: true

# THE PROMISE. First block below the hero, and the single most important
# paragraph on the site. The pillars are the three phases, named here and
# expanded further down in phases.yaml.
#
# SCANNING RULES FOR EVERY BLOCK ON THIS PAGE: lead with the point, one idea per
# sentence, no subordinate clause before the verb. Nobody reads. They scan.
# Do not put pain or qualification above this block.
# See strategy/Site Architecture.md
promise: |
  **10 Kinds is a UK AI consultancy for SMEs.** We get the AI already running in your business under control, teach your people to use it well, and build the systems that automate slow work. Inside 6 to 12 months teams often do 3-5x more, without adding headcount.

pillars:
  - name: "Discover"
    text: "Find every AI tool in use, including the ones nobody approved, and the manual work costing you most."
  - name: "Foundations"
    text: "Rules signed off and everyone trained. This leads to a cultural change that unlocks true value. ISO/IEC 42001 evidence naturally falls out of it."
  - name: "Takeoff"
    text: "Automate the work worth automating, ship it, then keep it running so the gains hold."
