enable: true

# THE PROMISE. First block below the hero, and the single most important
# paragraph on the site. The pillars are the three phases, named here and
# expanded further down in phases.yaml.
#
# SCANNING RULES FOR EVERY BLOCK ON THIS PAGE: lead with the point, one idea per
# sentence, no subordinate clause before the verb. Nobody reads. They scan.
# Do not put pain or qualification above this block.
# See strategy/Site Architecture.md
promise: |
  **10 Kinds is a UK AI consultancy for SMEs.** We get the AI already running in your business under control, teach your people to use it well, and build the systems that automate slow work. Gains typically show in 6 to 12 months, without adding headcount.

pillars:
  - name: "Discover"
    text: "One accurate list of every AI tool in use, including the ones nobody approved, plus a ranked shortlist of the manual work worth automating."
  - name: "Foundations"
    text: "A signed policy, your people trained desk to board, and ISO/IEC 42001 evidence. The cultural change is what unlocks the value; the paperwork falls out of it."
  - name: "Takeoff"
    text: "Working systems doing the slow work, the before and after measured, and a retainer keeping them alive so the gains hold."
