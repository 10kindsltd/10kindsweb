title: "Why me"

intro: "I sit on both sides of the table most consultants only see one of."

sides:
  - heading: "On the business side"
    text: "A postgraduate background in business administration — so I can sit in your board meeting and talk ROI, priorities, and what's actually worth doing."
  - heading: "On the technical side"
    text: "AWS Certified in Generative AI — so I can build prototypes to test ideas, brief and manage developers, and tell you straight whether what a vendor is proposing makes sense, technically and commercially."

summary: "That combination is rare, and it's the whole point. You get strategy that's grounded in reality, and technical judgement that's grounded in your business goals — from one person, accountable to you. No hype. No wasted budget. Just a clear path from \"we should probably do something with AI\" to something that actually works."

footer: "I work remotely with clients across the UK and beyond."
