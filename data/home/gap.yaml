enable: true

title: "Even if the EU AI Act doesn't apply to you..."
text: "UK GDPR already covers a lot of the same ground, and most of this pressure never came from Brussels in the first place. It comes from your own customers, your own board, and your own suppliers."

cards:
  - heading: "The stalled deal"
    text: "A customer's procurement team sends an AI due-diligence questionnaire, and the deal sits behind it until you can answer it in writing."
  - heading: "Shadow AI"
    text: "Staff pasting corporate & client data into consumer AI tools, with no register of what's being used or where the data goes."
  - heading: "Vendor risk"
    text: "Every AI-enabled tool you've brought in carries the vendor's governance gaps as well as your own."
  - heading: "Regulatory exposure"
    text: "UK GDPR already binds how you use AI, with or without the EU AI Act in play. The ICO doesn't need Brussels to enforce it."
  - heading: "Board accountability"
    text: "Someone has to be able to tell the board what AI risk the organisation is carrying - can you?"
  - heading: "Commercial trust"
    text: "The organisations that can prove control win the deal, pass the audit, and get asked fewer questions next time."

outcome:
  heading: "...once you're in control"
  points:
    - "A due-diligence questionnaire arrives and you answer it the same week, not the same quarter"
    - "Your board can confidently state your AI exposure"
    - "You know every AI tool in use across the business, and what each vendor does with your data"
    - "You know which regulations apply to you, and can show it in writing"

callout: "Let's get you covered."
callout_link: "Book a free call"
