enable: true

title: "The governance gap doesn't stay hidden"
text: "It surfaces the moment someone outside your organisation asks how your AI is actually controlled, and by then it's too late to build the answer from scratch."

cards:
  - heading: "The stalled deal"
    text: "A customer's procurement team sends an AI due-diligence questionnaire, and the deal sits behind it until you can answer it in writing."
  - heading: "Shadow AI"
    text: "Staff pasting client data into consumer AI tools, with no register of what's being used or where the data goes."
  - heading: "Vendor risk"
    text: "Every AI-enabled tool you've bought in carries the vendor's governance gaps as well as your own."
  - heading: "Regulatory exposure"
    text: "The EU AI Act and UK GDPR both bind AI use today, whether or not anyone in the business has read them."
  - heading: "Board accountability"
    text: "Someone has to be able to tell the board what AI risk the organisation is carrying, and most can't yet."
  - heading: "Commercial trust"
    text: "The organisations that can prove control win the deal, pass the audit, and get asked fewer questions next time."

callout: "Let's get you covered."
callout_link: "Book a free call"
