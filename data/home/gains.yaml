      label: "less time on professional writing tasks, with quality rated 18% higher"
    - figure: "15%"
      label: "more work completed per hour, measured across 5,172 support staff"
  note: "The largest gains go to less experienced staff and capability is what turns a tool into real savings. That's why training matters more than tools."
  source: "Sources: [Noy & Zhang, *Science*, 2023](https://www.science.org/doi/10.1126/science.adh2586) and [Brynjolfsson, Li & Raymond, *Quarterly Journal of Economics*, 2025](https://academic.oup.com/qje/article/140/2/889/7990658)."

pairs:
  - before: "A questionnaire arrives. Sales goes quiet for three weeks."
    after: "You answer it that week, from documents you already have."
  - before: "Nobody can say how many AI tools are in use."
    after: "There's a list. It has an owner. It's current."
  - before: "A few enthusiasts use AI. Everyone else works around it."
