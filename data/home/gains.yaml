enable: true

# The payoff, stated before the method. Outcomes only: no deliverables, no
# durations, no prices. Those live on /services/ and /approach/.
# Short lines. Every pair has to be readable at a glance.
heading: "What changes"
text: "Two things. You can prove AI is controlled, and the slow work stops being done by hand."

stat:
  figure: "3-5x"
  label: "capacity, without adding headcount"
  note: "What we typically see in an SME team over 6 to 12 months, once the right processes are automated and people know how to use what they've been given."

pairs:
  - before: "A questionnaire arrives. Sales goes quiet for three weeks."
    after: "You answer it that week, from documents you already have."
  - before: "Nobody can say how many AI tools are in use."
    after: "There's a list. It has an owner. It's current."
  - before: "A few enthusiasts use AI. Everyone else works around it."
    after: "Using it well is how the job gets done here."
  - before: "The slow document work gets absorbed as normal."
    after: "It runs on a schedule, not on someone remembering."
