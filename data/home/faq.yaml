enable: true

heading: "Questions"

# `pages` controls which pages each question appears on.
# Valid values: home, governance, training, build, services, about
items:
  - q: "What does 10 Kinds do?"
    pages: ["home", "about"]
    a: |
      Three phases. **Discover**: we find where AI is already being used, including the tools nobody approved, and the manual work costing you most.

      **Foundations**: the rules get agreed and everyone gets trained, desk to board. This is the phase that changes how people work, and it's where most of the value is unlocked. The ISO/IEC 42001 evidence comes out of it.

      **Takeoff**: we design, build and ship the systems that automate the slow work, then keep them running.

      Most organisations arrive with the governance question because that's what's in front of them. You can start at any phase and stop after any of them.

  - q: "We were sent a customer due-diligence questionnaire about our AI. Can you help?"
    pages: ["home", "governance"]
    a: "That's the most common way people find us. Book a free call and bring it with you: we can discuss it, and what it would take to close the gaps."

  - q: "We don't build AI ourselves, we just use tools like ChatGPT or Copilot. Does this still apply?"
    pages: ["governance"]
    a: |
      Yes, though usually not because of the EU AI Act. Article 50's transparency duties mostly bind the people who build and supply AI systems, and drafting documents internally with Copilot triggers none of them.

      What reaches you is UK GDPR, your customers' due-diligence questionnaires, and the risk sitting in tools you've bought in: an unmanaged register of AI use, a policy nobody's read, a vendor whose own controls you haven't checked. That's the ground we cover.

  - q: "Will you tell us whether we're a high-risk provider under the EU AI Act?"
    pages: ["governance"]
    a: |
      No. Your legal classification is a question for a solicitor, and you should want that answer in writing from one rather than from a consultancy.

      What we do is build the machinery it depends on: the AI inventory, the risk process, the documentation and the human oversight controls. That work is useful whichever way the classification goes, and a customer's questionnaire asks for it either way. We'll also hand you the specific questions worth putting to a lawyer, so the legal spend is short and targeted.

  - q: "Is this just data protection with an AI label on it?"
    pages: ["governance"]
    a: "There's real overlap. UK GDPR already covers a lot of what 'AI governance' means in practice. We're clear about where your existing data protection work already answers the question, and where AI adds a distinct one."

  - q: "Do we need to be ISO 42001 certified?"
    pages: ["governance", "services"]
    a: "Not necessarily. Certification only pays off if you're regularly asked to prove it, most often because a customer's procurement team demands it. We'll give you a straight read on whether it's worth pursuing or whether a lighter governance setup covers your actual risk."

  - q: "We'd rather not advertise how messy this is. Is what we tell you confidential?"
    pages: ["governance", "build", "services"]
    a: |
      Yes. Everything you tell us stays between us, on the free call as much as in a paid engagement, and we'll sign your NDA before the first conversation if you'd rather have it in writing.

      Nobody gets named in a case study, a talk or a post without asking you first. Most of what we're shown is the same handful of gaps we see everywhere, so there's nothing to be embarrassed about in any case.

  - q: "What happens to our data while you're working with us?"
    pages: ["governance", "build", "services"]
    a: |
      We work from the minimum we need to do the job, on our own equipment, and we hand back or delete what we hold at the end of an engagement.

      Your documents and business data never get fed into public AI models to train them. Anything we build for you runs on infrastructure scoped to your organisation and sees only the data you point it at.

  - q: "Do we have to do governance work before you'll train our team?"
    pages: ["training", "services"]
    a: |
      No. Training stands on its own and plenty of organisations book a day without anything else.

      It does work better once there are rules to teach. If you don't have an acceptable use policy yet, we'll cover the questions your people will hit anyway and tell you straight which ones only you can answer.

  - q: "Is this Copilot training, ChatGPT training, or something else?"
    pages: ["training"]
    a: "Whatever your organisation runs. We cover the tools you've bought and the ones your staff found on their own, because both are in use. The habits that matter, knowing where a model is reliable and how to check it, carry across all of them and outlast whichever one you're on this year."

  - q: "Does training count towards ISO 42001?"
    pages: ["training", "governance"]
    a: "It contributes. ISO/IEC 42001 asks you to show the people working with AI are competent to do so, and training is how you get there. Keeping the records is your side of it, and we'll tell you what to keep. Training alone doesn't get you certified, and nothing we do makes the certification decision for you."

  - q: "Can you build things, or is it just advice?"
    pages: ["home", "build", "training"]
    a: "Both, and the building is the point. We design, build and ship AI systems ourselves rather than handing you a specification and wishing you luck. Governance is usually how organisations find us. Training is what changes how people work. Building is what changes what the business can do."

  - q: "How do we get started?"
    pages: ["home", "governance", "build", "services", "about"]
    a: "Book a free 30-minute call. If a questionnaire's what brought you here, bring it along and we can discuss it. We'll give you a straight read on where you stand and what the right next step looks like."
