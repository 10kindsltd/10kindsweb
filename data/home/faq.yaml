enable: true

heading: "Questions"

items:
  - q: "What does 10 Kinds actually do?"
    a: |
      We help you find where AI is actually being used in your organisation, put governance around it, and get you ready to answer the questions a customer, regulator or auditor will ask about it.

      That covers everything from a single questionnaire to a full ISO/IEC 42001 management system and the ongoing audit cycle that keeps it current.

  - q: "We were sent a customer due-diligence questionnaire about our AI. Can you help?"
    a: "That's the most common way people find us. Forward it over and we'll map every question to the evidence that answers it, tell you what you can already prove, and what closing the rest takes. No obligation."

  - q: "We don't build AI ourselves, we just use tools like ChatGPT or Copilot. Does this still apply?"
    a: "Yes. Most AI governance risk sits in tools you've bought in rather than ones you've built: an unmanaged register of AI use, a policy nobody's read, or a vendor whose own controls you haven't checked. That's exactly the ground we cover."

  - q: "Is this just data protection with an AI label on it?"
    a: "There's real overlap. UK GDPR already covers a lot of what 'AI governance' means in practice. We're clear about where your existing data protection work already answers the question, and where AI adds a genuinely new one."

  - q: "Do we need to be ISO 42001 certified?"
    a: "Not necessarily. Certification only pays off if you're regularly asked to prove it, most often because a customer's procurement team demands it. We'll give you a straight read on whether it's worth pursuing or whether a lighter governance setup covers your actual risk."

  - q: "How long does an implementation take?"
    a: "A full management system build runs 20 to 28 consultant days spread across four to six months. The elapsed time is your team doing the work between sessions, not idle calendar. A gap assessment alone is a matter of days."

  - q: "How do we get started?"
    a: "Book a free 30-minute call, or send over a questionnaire if that's what's brought you here. We'll give you a straight read on where you stand and what the right next step looks like."
