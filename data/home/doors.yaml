enable: true

heading: "Two ways we help"
text: "Most organisations arrive with the first problem and stay for the second."

cards:
  - eyebrow: "Get in control"
    heading: "AI governance"
    text: "Find every AI tool in use across the business, agree the rules, and get to where you can answer a customer's due-diligence questionnaire the same week it arrives."
    points:
      - "An AI inventory, including the tools nobody approved"
      - "An acceptable use policy your leadership has signed"
      - "Controls and evidence mapped to ISO/IEC 42001"
      - "A plain read on what the EU AI Act asks of you"
    link: "/governance/"
    label: "How governance works"

  - eyebrow: "Get building"
    heading: "AI that pays for itself"
    text: "The slow, manual, document-shaped work your team has absorbed as normal. We find the parts worth automating, then design, build and ship them."
    points:
      - "A working prototype in a day, on simulated data"
      - "Custom builds embedded in how your teams already work"
      - "Workflows that run on a schedule rather than on someone remembering"
      - "Built by people who ship AI products for a living"
    link: "/build/"
    label: "What we build"

footer_text: "Every engagement is a fixed price against a written scope, with the deliverables named up front. [See what everything costs](/services/)."
