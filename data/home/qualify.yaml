enable: true

heading: "Does AI governance apply to you?"
text: |
  <mark class="bg-yellow-200 rounded px-1">You don't need to build AI yourself for this to be your problem.</mark>

points:
  - "Staff use ChatGPT, Copilot or another AI tool, with or without a policy covering it"
  - "You sell software or services to enterprise or regulated customers"
  - "You have any customers, users or business in the EU, even without an EU office"
  - "AI touches client data, personal data, or anything commercially sensitive"
  - "A customer, insurer or regulator has ever sent you a security or AI questionnaire"

note_heading: "Don't build AI yourself? That's no excuse"
note_text: "Most AI governance risk sits in tools you've bought in, not ones you've built: an unmanaged register of use, a policy nobody's read, a vendor whose controls you've never checked."

stats:
  - label: "Potential fine"
    figure: "€15m"
    text: |
      or 3% of global turnover, whichever is greater: the **maximum penalty for breaching the EU AI Act's transparency rules**, binding law <mark class="bg-yellow-200 rounded px-1">since 2 August 2026</mark>.
    source_text: "EU AI Act, Article 99"
    source_url: "https://artificialintelligenceact.eu/article/99/"
    warn: true

  - figure: "71%"
    label: "Shadow AI usage"
    text: "of UK employees have used AI tools at work without approval, and 51% do so every week."
    source_text: "Microsoft/Censuswide, October 2025"
    source_url: "https://ukstories.microsoft.com/features/rise-in-shadow-ai-tools-raising-security-concerns-for-uk/"
