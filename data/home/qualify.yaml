enable: true

heading: "Does AI governance apply to you?"
text: |
  Two reasons it might, and most organisations have both. Some AI use carries legal duties. The rest gets asked about anyway.

point_groups:
  - label: "You may have legal duties"
    points:
      - "You **place AI-enabled products or services in the EU market**, or your AI outputs are used there"
      - "Your AI **speaks to customers**, or generates content you publish under your name"
      - "AI touches **client data, personal data**, or anything commercially sensitive"

  - label: "Either way, someone will ask"
    points:
      - "A customer, insurer or regulator has ever sent you a **security or AI questionnaire**"
      - "You sell software or services to **enterprise or regulated customers**"
      - "Staff use **ChatGPT, Copilot** or another AI tool, with or without a policy covering it"
      - "Your board has asked **what AI the business is running**, and what happens if it goes wrong"

note_heading: "Even if you answered no, you still have work to do"
note_text: "UK GDPR [already binds how you use AI](/governance/#gap) the moment personal data is involved, and it almost always is. Someone pasting a customer email into ChatGPT is a processing decision nobody approved, in a tool nobody checked."

stats:
  - label: "Potential fines"
    figure: "€15m / 3% turnover"
    text: |
      for breaching the EU AI Act's transparency rules, law since 2 August 2026. But most internal AI use [triggers none of them](/governance/#regulation).
    source_text: "EU AI Act, Article 99"
    source_url: "https://artificialintelligenceact.eu/article/99/"

  - figure: "71%"
    label: "Shadow AI usage"
    text: "of UK employees have used AI tools at work without approval, and 51% do so every week."
    source_text: "Microsoft/Censuswide, October 2025"
    source_url: "https://ukstories.microsoft.com/features/rise-in-shadow-ai-tools-raising-security-concerns-for-uk/"

